[package]
name = "wrk3"
version = "0.1.0"
edition = "2024"
authors = ["Evan Jones (原文軒) <me@yuenmh.dev>"]
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "string"] }
crossbeam = "0.8.5"
futures = "0.3.34"
http = "1.5.0"
humantime = "2.4.0"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
mlua = { version = "0.12.1", features = ["luajit", "vendored", "async", "serde", "send"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["rc", "serde_derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
indoc = "2.0.7"
insta = "1.48.0"
